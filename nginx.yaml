- name: set up nginx and host web server
  hosts: webservers
  become: yes
  
  tasks:
    - name: install nginx
      apt:
       name: nginx
       state: present
       update_cache: yes
       
    - name: copy the html to the path
      copy:
       src: index.html
       dest: /var/www/html/index.html
       
    - name: ensure the service is running
      service:
        name: nginx
        state: started
        enabled: yes
        
       
