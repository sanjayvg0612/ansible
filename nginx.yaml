- name: set up nginx and host web server
  hosts: webservers
  become: yes
  gather_facts: no

  tasks:

    - name: copy the html to the path
      copy:
        src: index.html
        dest: /var/www/html/index.html

    - name: ensure the service is running
      service:
        name: nginx
        state: started
        enabled: yes
